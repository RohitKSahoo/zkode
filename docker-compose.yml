services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zkode-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./backend/zkode.db:/app/zkode.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zkode-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    restart: unless-stopped
